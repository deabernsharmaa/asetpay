# P1-05 / P1-06 — the daily snapshot.
#
# This is the only genuinely time-sensitive thing in the project. On the free
# data path, history not captured today cannot be bought back at any price. So
# this runs on GitHub's schedule rather than a laptop: laptops sleep, travel and
# run out of battery, and a missed night is permanent.
#
# Output goes to a dated GitHub RELEASE, not to Actions artifacts. Artifacts
# expire after 90 days by default, which would silently destroy your history at
# exactly the 90-day mark. Release assets do not expire and do not count against
# repository size.
#
# 03:00 UTC rather than just after the US close: free-tier scheduled runs can be
# delayed under load, and a delay must not push the job into the next session and
# corrupt the knowledge_date label.

name: snapshot

on:
  schedule:
    - cron: "0 3 * * 2-6"   # Tue-Sat 03:00 UTC = post-close Mon-Fri US
  workflow_dispatch:         # manual re-run to backfill a missed day
    inputs:
      session:
        description: "trading day to capture, YYYY-MM-DD (defaults to the previous session)"
        required: false

permissions:
  contents: write            # needed to create releases

concurrency:
  group: snapshot
  cancel-in-progress: false  # never cancel a capture in flight

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --package asetpay-snapshotter --frozen

      - name: Capture
        env:
          # Set PRICE_SOURCE as a repository VARIABLE (not a secret) so the
          # feed in use is visible on the Actions page rather than hidden.
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE || 'polygon' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: ${{ vars.ALPACA_FEED }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          uv run python -m asetpay_snapshotter.capture \
            --out ./out \
            ${{ inputs.session && format('--session {0}', inputs.session) || '' }}

      - name: Read manifest
        id: manifest
        run: |
          echo "kdate=$(jq -r .knowledge_date out/_manifest.json)"     >> "$GITHUB_OUTPUT"
          echo "session=$(jq -r .session out/_manifest.json)"          >> "$GITHUB_OUTPUT"
          echo "rows=$(jq -r .row_count out/_manifest.json)"           >> "$GITHUB_OUTPUT"
          echo "prov=$(jq -r .provider out/_manifest.json)"            >> "$GITHUB_OUTPUT"
          echo "cov=$(jq -r .universe_coverage out/_manifest.json)"    >> "$GITHUB_OUTPUT"
          echo "miss=$(jq -r '.missing_symbols | join(" ")' out/_manifest.json)" >> "$GITHUB_OUTPUT"
          echo "exp=$(jq -r .expected_trading out/_manifest.json)"       >> "$GITHUB_OUTPUT"
          echo "usize=$(jq -r .universe_size out/_manifest.json)"        >> "$GITHUB_OUTPUT"

      # Fail loudly on an empty capture rather than publishing a release that
      # looks fine and contains nothing. A silent empty day is worse than a
      # visibly failed job, because nobody investigates a green tick.
      - name: Refuse to publish an empty snapshot
        run: |
          test "${{ steps.manifest.outputs.rows }}" -gt 0 \
            || { echo "::error::snapshot contained 0 rows"; exit 1; }

      # IMMUTABLE means immutable. action-gh-release happily UPDATES an existing
      # release, which would silently rewrite a day of history and leave no
      # trace — the one thing the point-in-time store cannot survive. So a
      # re-capture of a session that already has a release is a hard stop, and
      # the operator decides what to do about it.
      - name: Refuse to overwrite an existing session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="snapshot-${{ steps.manifest.outputs.session }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists. A correction is a NEW snapshot, never an overwrite."
            exit 1
          fi

      - name: Publish as a dated release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ steps.manifest.outputs.session }}
          name: Snapshot ${{ steps.manifest.outputs.session }}
          body: |
            Immutable market-data capture.
            session:           ${{ steps.manifest.outputs.session }}
            knowledge_date:    ${{ steps.manifest.outputs.kdate }}
            provider:          ${{ steps.manifest.outputs.prov }}
            rows:              ${{ steps.manifest.outputs.rows }}
            universe_coverage: ${{ steps.manifest.outputs.cov }}
            expected_trading:  ${{ steps.manifest.outputs.exp }} of ${{ steps.manifest.outputs.usize }}
            absent:            ${{ steps.manifest.outputs.miss }}
          files: |
            out/*.parquet
            out/_manifest.json
          fail_on_unmatched_files: true
