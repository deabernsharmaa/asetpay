[project]
name = "asetpay-core"
version = "0.1.0"
description = "Store, features, signals, evaluation, portfolio, risk"
requires-python = ">=3.12"
dependencies = [
    "asetpay-contracts",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",   # Newey-West / HAC. Not optional — see harness.py
    "duckdb>=1.0",
    "scikit-learn>=1.5",   # LedoitWolf shrinkage for the combiner
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asetpay_core"]
