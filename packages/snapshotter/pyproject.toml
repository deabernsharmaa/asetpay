[project]
name = "asetpay-snapshotter"
version = "0.1.0"
description = "Daily immutable market-data capture. Runs on GitHub Actions."
requires-python = ">=3.12"
dependencies = [
    "asetpay-contracts",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asetpay_snapshotter"]
